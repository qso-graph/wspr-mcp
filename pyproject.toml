[project]
name = "wspr-mcp"
version = "0.6.0"
description = "MCP server for WSPR beacon data analytics — band openings, path analysis, solar correlation"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Greg Beam, KI7MT", email = "maintainers@qso-graph.io"}]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0,<5",
    "certifi>=2026.10.19",
]
keywords = [
    "amateur-radio", "ham-radio", "wspr", "beacon", "propagation",
    "mcp", "model-context-protocol", "band-openings", "hf",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Ham Radio",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://qso-graph.io"
Documentation = "https://qso-graph.io/servers/wspr/"
Repository = "https://github.com/qso-graph/wspr-mcp"
Issues = "https://github.com/qso-graph/wspr-mcp/issues"

[project.scripts]
wspr-mcp = "wspr_mcp.server:main"


[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6.8", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wspr_mcp"]

# Lint and type settings follow adif-mcp, the reference for every qso-graph
# Python repo (qso-graph-devel#66). Copied rather than invented so the repos do
# not each grow a style of their own.
[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 95
extend-exclude = [".venv", "dist", "build", ".eggs", ".pytest_cache", "site"]

[tool.ruff.lint]
# F and I are the rules that find defects: an unused import, an undefined name,
# an import block out of order. They run here from the start.
#
# E501 is a width, and it was deferred here while the rules that find defects
# went in first (qso-graph-devel#70). That pass has now happened for this repo
# (#21): it reported five lines, none of them a defect, and all five reflowed.
#
# No line here needed an exemption. Where one does — a line long because it
# names a publisher's field exactly, as in adif-mcp's
# `pas["Adif"]["Enumerations"]["Primary_Administrative_Subdivision"]["Records"]`
# — the length is the correctness, this project's rule being that the owner of
# a list is its authority, and it would be marked `# noqa: E501` with the
# reason written beside it rather than ignored in bulk. This repo simply has
# none.
select = ["E", "F", "I"]
ignore = []
fixable = ["I"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
ignore_missing_imports = true
